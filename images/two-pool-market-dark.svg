<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="An oracle price feeds a Null market. The market holds nmUSDC collateral in two pools and settlement moves value between them.">
  <title>Two pools, one pot of collateral</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8d9fa"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#787c86"/>
    </marker>
  </defs>

  <rect x="290" y="28" width="180" height="52" rx="12" fill="#141416" stroke="#29323b"/>
  <text x="380" y="50" text-anchor="middle" fill="#d4dce7" font-size="12.5" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">Oracle price</text>
  <text x="380" y="68" text-anchor="middle" fill="#a0a0a0" font-size="10.5" font-family="Inter, system-ui, -apple-system, sans-serif">the price both pools settle on</text>

  <rect x="230" y="118" width="300" height="66" rx="12" fill="#141416" stroke="#b8d9fa"/>
  <text x="380" y="146" text-anchor="middle" fill="#d4dce7" font-size="14" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">The market</text>
  <text x="380" y="166" text-anchor="middle" fill="#a0a0a0" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">holds all of the collateral, in nmUSDC</text>

  <line x1="380" y1="80" x2="380" y2="110" stroke="#787c86" stroke-width="1.25" marker-end="url(#arrowGray)"/>

  <rect x="60" y="232" width="210" height="76" rx="12" fill="#141416" stroke="#b8d9fa"/>
  <text x="165" y="262" text-anchor="middle" fill="#d4dce7" font-size="13.5" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">Receiver pool</text>
  <text x="165" y="282" text-anchor="middle" fill="#a0a0a0" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">gains when the price rises</text>

  <rect x="490" y="232" width="210" height="76" rx="12" fill="#141416" stroke="#29323b"/>
  <text x="595" y="262" text-anchor="middle" fill="#d4dce7" font-size="13.5" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">Payer pool</text>
  <text x="595" y="282" text-anchor="middle" fill="#a0a0a0" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">gains when the price falls</text>

  <path d="M330,184 L210,224" fill="none" stroke="#787c86" stroke-width="1.25" marker-end="url(#arrowGray)"/>
  <path d="M430,184 L550,224" fill="none" stroke="#787c86" stroke-width="1.25" marker-end="url(#arrowGray)"/>

  <line x1="278" y1="270" x2="482" y2="270" stroke="#b8d9fa" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="380" y="256" text-anchor="middle" fill="#a0a0a0" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">settlement moves collateral</text>
  <text x="380" y="296" text-anchor="middle" fill="#a0a0a0" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">price moves one way, funding the other</text>

  <text x="110" y="140" fill="#a0a0a0" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">You buy a share</text>
  <text x="110" y="156" fill="#a0a0a0" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">of one pool</text>
  <path d="M150,164 C170,190 180,205 188,224" fill="none" stroke="#b8d9fa" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
