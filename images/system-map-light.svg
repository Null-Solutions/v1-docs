  <text x="140" y="230" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">yield pays funding</text>

  <line x1="120" y1="100" x2="120" y2="152" stroke="#afb4bc" stroke-width="1.25"/>
