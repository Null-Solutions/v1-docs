  <line x1="480" y1="60" x2="552" y2="60" stroke="#2e8afa" stroke-width="1.5"/>
  <polygon points="560,60 550,55.5 550,64.5" fill="#2e8afa"/>

  <rect x="40" y="160" width="200" height="88" rx="12" fill="#ffffff" stroke="#dee6ee"/>
