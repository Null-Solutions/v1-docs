  <text x="390" y="74" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">nmUSDC, lent out</text>

  <rect x="560" y="28" width="160" height="64" rx="12" fill="#ffffff" stroke="#dee6ee"/>
  <text x="640" y="54" text-anchor="middle" fill="#2d2c2c" font-size="13" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">Long book</text>
  <text x="640" y="74" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">USDC vs Receiver</text>

  <line x1="200" y1="74" x2="292" y2="60" stroke="#2e8afa" stroke-width="1.5"/>
