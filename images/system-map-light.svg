<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="USDC flows into the Null Savings Vault and into Spot pools. The vault lends to Morpho long books. Margin borrows from those books.">
  <title>How the four products sit on the primitive</title>
  <text x="120" y="36" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">Cash</text>
