  <text x="128" y="132" fill="#6e6e6e" font-size="10.5" font-family="Inter, system-ui, -apple-system, sans-serif">Spot Buy wraps</text>

  <rect x="300" y="168" width="160" height="72" rx="12" fill="#ffffff" stroke="#dee6ee"/>
  <text x="380" y="198" text-anchor="middle" fill="#2d2c2c" font-size="13" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">Receiver pool</text>
  <text x="380" y="218" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">oracle return</text>

  <rect x="500" y="168" width="160" height="72" rx="12" fill="#ffffff" stroke="#dee6ee"/>
  <text x="580" y="198" text-anchor="middle" fill="#2d2c2c" font-size="13" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">Payer pool</text>
  <text x="580" y="218" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">backs Receiver</text>

  <line x1="240" y1="204" x2="292" y2="204" stroke="#afb4bc" stroke-width="1.25"/>
  <polygon points="300,204 290,199.5 290,208.5" fill="#afb4bc"/>
