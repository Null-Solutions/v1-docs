  <polygon points="380,300 375.5,290 384.5,290" fill="#afb4bc"/>

  <rect x="540" y="300" width="180" height="72" rx="12" fill="#ffffff" stroke="#2e8afa"/>
  <text x="630" y="330" text-anchor="middle" fill="#2d2c2c" font-size="13" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">Margin</text>
  <text x="630" y="350" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">Long borrows USDC</text>

