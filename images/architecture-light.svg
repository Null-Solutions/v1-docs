<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 448" role="img" aria-label="Null V1 architecture: the factory creates markets, each market owns a Receiver and a Payer ERC-4626 pool, routers write to both pools, and Lens with Multicall read the market">
  <title>Null V1 architecture</title>

  <!-- Factory -->
  <rect x="40" y="48" width="170" height="68" rx="12" fill="#ffffff" stroke="#dee6ee"/>
  <text x="125" y="78" text-anchor="middle" fill="#2d2c2c" font-size="13.5" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">NullV1Factory</text>
  <text x="125" y="97" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">deploys and registers</text>

  <!-- Factory ? Market -->
  <line x1="210" y1="82" x2="290" y2="82" stroke="#afb4bc" stroke-width="1.25"/>
  <polygon points="300,82 290,77.5 290,86.5" fill="#afb4bc"/>
  <text x="255" y="68" text-anchor="middle" fill="#6e6e6e" font-size="10.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">createMarket</text>

  <!-- Market -->
  <rect x="300" y="36" width="200" height="92" rx="12" fill="#ffffff" stroke="#dee6ee"/>
  <text x="400" y="66" text-anchor="middle" fill="#2d2c2c" font-size="13.5" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">NullV1Market</text>
  <text x="400" y="85" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">settlement and accounting</text>
  <text x="400" y="106" text-anchor="middle" fill="#6e6e6e" font-size="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">(collateral, oracle, frm)</text>

  <!-- Market ? pools elbow -->
  <path d="M400,128 L400,166 M310,166 L490,166 M310,166 L310,192 M490,166 L490,192" fill="none" stroke="#afb4bc" stroke-width="1.25"/>
  <polygon points="310,200 305.5,192 314.5,192" fill="#afb4bc"/>
  <polygon points="490,200 485.5,192 494.5,192" fill="#afb4bc"/>

  <!-- Receiver pool -->
  <rect x="230" y="200" width="160" height="68" rx="12" fill="#ffffff" stroke="#dee6ee"/>
  <text x="310" y="230" text-anchor="middle" fill="#2d2c2c" font-size="13.5" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">Receiver pool</text>
  <text x="310" y="249" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">ERC-4626 shares</text>

  <!-- Payer pool -->
  <rect x="410" y="200" width="160" height="68" rx="12" fill="#ffffff" stroke="#dee6ee"/>
  <text x="490" y="230" text-anchor="middle" fill="#2d2c2c" font-size="13.5" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">Payer pool</text>
  <text x="490" y="249" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">ERC-4626 shares</text>

  <!-- Lens &#183; Multicall (reads the market) -->
  <rect x="600" y="200" width="160" height="68" rx="12" fill="#ffffff" stroke="#dee6ee"/>
  <text x="680" y="230" text-anchor="middle" fill="#2d2c2c" font-size="13.5" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">Lens &#183; Multicall</text>
  <text x="680" y="249" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">settlement-aware previews</text>
  <path d="M680,200 L680,82 L510,82" fill="none" stroke="#afb4bc" stroke-width="1.25" stroke-dasharray="5 4"/>
  <polygon points="500,82 510,77.5 510,86.5" fill="#afb4bc"/>
  <text x="690" y="144" text-anchor="start" fill="#6e6e6e" font-size="10.5" font-family="Inter, system-ui, -apple-system, sans-serif">reads</text>

  <!-- Routers (write to both pools) -->
  <rect x="296" y="352" width="208" height="68" rx="12" fill="#ffffff" stroke="#dee6ee"/>
  <text x="400" y="382" text-anchor="middle" fill="#2d2c2c" font-size="13.5" font-weight="600" font-family="Inter, system-ui, -apple-system, sans-serif">Routers</text>
  <text x="400" y="401" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Inter, system-ui, -apple-system, sans-serif">deposit / redeem + oracle update</text>
  <path d="M400,352 L400,314 M310,314 L490,314 M310,314 L310,278 M490,314 L490,278" fill="none" stroke="#2e8afa" stroke-width="1.5"/>
  <polygon points="310,268 305.5,278 314.5,278" fill="#2e8afa"/>
  <polygon points="490,268 485.5,278 494.5,278" fill="#2e8afa"/>
  <text x="298" y="318" text-anchor="end" fill="#2e8afa" font-size="10.5" font-family="Inter, system-ui, -apple-system, sans-serif">writes settle the market first</text>
</svg>
