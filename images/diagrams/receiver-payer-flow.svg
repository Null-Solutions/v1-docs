<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Receiver and Payer market flow</title>
  <desc id="desc">Oracle prices update a Null market. Receiver shares get reference-asset return and pay funding. Payer shares back that exposure, receive funding, and take the opposite price risk.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0B0E15" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#45A5FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#1B252D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="34" fill="#F6F7F9"/>
  <circle cx="1008" cy="96" r="118" fill="#B1DFFF" fill-opacity="0.18"/>
  <circle cx="178" cy="478" r="142" fill="#B1DFFF" fill-opacity="0.14"/>
  <text x="64" y="78" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="34" letter-spacing="-0.02em">Market roles at a glance</text>
  <text x="64" y="114" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="18">A market has two pooled sides. Oracle updates decide price settlement; funding always moves from Receiver to Payer.</text>

  <g filter="url(#softShadow)">
    <rect x="72" y="178" width="252" height="156" rx="28" fill="white"/>
    <rect x="96" y="202" width="58" height="58" rx="17" fill="#B1DFFF" fill-opacity="0.38"/>
    <path d="M116 232H139M127.5 220.5V243.5" stroke="#1B252D" stroke-width="4" stroke-linecap="round"/>
    <text x="96" y="286" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="24" letter-spacing="-0.01em">Oracle price</text>
    <text x="96" y="314" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="16">Reference asset input</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="474" y="158" width="252" height="196" rx="32" fill="#0B0E15"/>
    <rect x="502" y="188" width="196" height="44" rx="22" fill="#B1DFFF" fill-opacity="0.18"/>
    <text x="524" y="217" fill="#B1DFFF" font-family="Inter, Arial, sans-serif" font-size="16">updates before actions</text>
    <text x="502" y="278" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" letter-spacing="-0.02em">Null market</text>
    <text x="502" y="310" fill="#C9D0D9" font-family="Inter, Arial, sans-serif" font-size="16">settles price movement, funding, and collateral accounting</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="86" y="388" width="394" height="122" rx="30" fill="white"/>
    <circle cx="138" cy="449" r="28" fill="#45A5FF"/>
    <path d="M128 452L138 438L148 452" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="186" y="437" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="25" letter-spacing="-0.01em">Receiver pool</text>
    <text x="186" y="468" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="16">gets reference return, pays funding</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="720" y="388" width="394" height="122" rx="30" fill="white"/>
    <circle cx="772" cy="449" r="28" fill="#1B252D"/>
    <path d="M762 446L772 460L782 446" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="820" y="437" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="25" letter-spacing="-0.01em">Payer pool</text>
    <text x="820" y="468" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="16">backs exposure, receives funding</text>
  </g>

  <path d="M330 256H456" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M600 356V389" stroke="#45A5FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 389C600 420 552 449 500 449" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M600 389C600 420 648 449 700 449" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M506 430C580 382 658 382 732 430" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="555" y="396" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="15">price rises</text>
  <path d="M730 474C656 522 578 522 504 474" stroke="#1B252D" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowDark)"/>
  <text x="548" y="530" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="15">price falls</text>
  <path d="M500 474C586 506 646 506 732 474" stroke="#96AEC4" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" marker-end="url(#arrowDark)"/>
  <text x="558" y="505" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="15">funding</text>
</svg>
