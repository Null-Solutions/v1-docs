<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Funding and carry flow</title>
  <desc id="desc">The exposure ratio E feeds the funding curve. Receiver pays funding as a cost of synthetic exposure. Payer receives funding for backing that exposure. If collateral is yield-bearing, collateral yield can accrue to both sides before directional price movement.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0B0E15" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#45A5FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#1B252D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="34" fill="#F6F7F9"/>
  <circle cx="1048" cy="116" r="130" fill="#B1DFFF" fill-opacity="0.18"/>
  <circle cx="138" cy="536" r="148" fill="#B1DFFF" fill-opacity="0.13"/>
  <text x="64" y="78" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="34" letter-spacing="-0.02em">Funding and carry</text>
  <text x="64" y="114" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="18">Funding prices the demand for Payer backing capital. Collateral yield is separate from funding.</text>

  <g filter="url(#softShadow)">
    <rect x="64" y="188" width="260" height="162" rx="30" fill="white"/>
    <text x="96" y="236" fill="#45A5FF" font-family="Inter, Arial, sans-serif" font-size="16">MARKET BALANCE</text>
    <text x="96" y="274" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="30" letter-spacing="-0.02em">Exposure ratio</text>
    <text x="96" y="310" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="17">E = Receiver / Payer</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="470" y="164" width="260" height="210" rx="32" fill="#0B0E15"/>
    <text x="504" y="216" fill="#B1DFFF" font-family="Inter, Arial, sans-serif" font-size="16">FUNDING CURVE</text>
    <text x="504" y="258" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" letter-spacing="-0.02em">mu * E</text>
    <text x="504" y="294" fill="#C9D0D9" font-family="Inter, Arial, sans-serif" font-size="16">Receiver APR rises as Receiver demand grows relative to Payer liquidity.</text>
    <rect x="504" y="326" width="154" height="34" rx="17" fill="#B1DFFF" fill-opacity="0.16"/>
    <text x="526" y="348" fill="#B1DFFF" font-family="Inter, Arial, sans-serif" font-size="14">capped at 100%</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="876" y="188" width="260" height="162" rx="30" fill="white"/>
    <text x="908" y="236" fill="#45A5FF" font-family="Inter, Arial, sans-serif" font-size="16">COLLATERAL</text>
    <text x="908" y="274" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="30" letter-spacing="-0.02em">Base yield</text>
    <text x="908" y="310" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="17">Optional ERC-4626 collateral yield, not a Receiver-to-Payer payment.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="184" y="442" width="320" height="96" rx="28" fill="white"/>
    <circle cx="232" cy="490" r="25" fill="#45A5FF"/>
    <path d="M223 493L232 480L241 493" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="278" y="482" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="23">Receiver carry</text>
    <text x="278" y="512" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="16">collateral yield minus funding</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="696" y="442" width="320" height="96" rx="28" fill="white"/>
    <circle cx="744" cy="490" r="25" fill="#1B252D"/>
    <path d="M735 488L744 501L753 488" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="790" y="482" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="23">Payer carry</text>
    <text x="790" y="512" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="16">collateral yield plus funding</text>
  </g>

  <path d="M324 269H450" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M600 374C536 412 432 430 360 442" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M600 374C664 412 768 430 840 442" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M876 350C780 410 688 430 504 466" stroke="#96AEC4" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" marker-end="url(#arrowDark)"/>
  <path d="M1006 350C978 405 936 430 892 442" stroke="#96AEC4" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" marker-end="url(#arrowDark)"/>
  <text x="560" y="424" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="15">funding flows Receiver to Payer</text>
  <text x="760" y="396" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="15">yield applies through collateral accounting</text>
</svg>
