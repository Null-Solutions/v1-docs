<svg width="1200" height="660" viewBox="0 0 1200 660" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Null V1 developer contract stack</title>
  <desc id="desc">Integrations use the Router, Lens, and indexer around the core contracts. The Factory deploys Markets, each Market owns a Receiver pool and Payer pool, and Oracles provide prices to Market accounting.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0B0E15" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#45A5FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#1B252D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="660" rx="34" fill="#F6F7F9"/>
  <circle cx="1060" cy="116" r="132" fill="#B1DFFF" fill-opacity="0.18"/>
  <circle cx="140" cy="594" r="144" fill="#B1DFFF" fill-opacity="0.14"/>
  <text x="64" y="78" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="34" letter-spacing="-0.02em">Developer stack</text>
  <text x="64" y="114" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="18">Core accounting is small. Periphery and read layers make app integrations easier.</text>

  <g filter="url(#softShadow)">
    <rect x="64" y="164" width="260" height="148" rx="30" fill="white"/>
    <text x="94" y="210" fill="#45A5FF" font-family="Inter, Arial, sans-serif" font-size="16">INTEGRATION</text>
    <text x="94" y="246" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="25" letter-spacing="-0.01em">App / bot / script</text>
    <text x="94" y="278" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="16">reads state, previews actions, sends transactions</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="452" y="154" width="296" height="168" rx="32" fill="#0B0E15"/>
    <text x="486" y="206" fill="#B1DFFF" font-family="Inter, Arial, sans-serif" font-size="16">PERIPHERY</text>
    <text x="486" y="244" fill="white" font-family="Inter, Arial, sans-serif" font-size="27" letter-spacing="-0.01em">NullV1Router</text>
    <text x="486" y="278" fill="#C9D0D9" font-family="Inter, Arial, sans-serif" font-size="16">protected create, deposit, redeem, oracle update data</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="876" y="164" width="260" height="148" rx="30" fill="white"/>
    <text x="906" y="210" fill="#45A5FF" font-family="Inter, Arial, sans-serif" font-size="16">READ LAYER</text>
    <text x="906" y="246" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="25" letter-spacing="-0.01em">Lens + indexer</text>
    <text x="906" y="278" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="16">preview state, batch reads, market lists</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="124" y="414" width="220" height="136" rx="30" fill="white"/>
    <text x="154" y="462" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="24" letter-spacing="-0.01em">Factory</text>
    <text x="154" y="494" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="16">deploys and discovers markets</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="448" y="394" width="304" height="176" rx="34" fill="white"/>
    <text x="486" y="444" fill="#45A5FF" font-family="Inter, Arial, sans-serif" font-size="16">CORE ACCOUNTING</text>
    <text x="486" y="482" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="28" letter-spacing="-0.02em">NullV1Market</text>
    <text x="486" y="516" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="16">owns settlement state and uses NullV1Math</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="856" y="390" width="130" height="150" rx="28" fill="white"/>
    <circle cx="921" cy="438" r="24" fill="#45A5FF"/>
    <path d="M912 440L921 428L930 440" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="884" y="488" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="19">Receiver</text>
    <text x="894" y="514" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="14">pool</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1006" y="390" width="130" height="150" rx="28" fill="white"/>
    <circle cx="1071" cy="438" r="24" fill="#1B252D"/>
    <path d="M1062 436L1071 448L1080 436" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1046" y="488" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="19">Payer</text>
    <text x="1045" y="514" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="14">pool</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="64" y="584" width="1072" height="42" rx="21" fill="white" fill-opacity="0.78"/>
    <text x="92" y="611" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="15">Integration rule: use periphery for protected writes, Lens/indexer for reads, and core contracts for canonical market and pool state.</text>
  </g>

  <path d="M324 238H432" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="346" y="218" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="14">write</text>
  <path d="M876 238H768" stroke="#1B252D" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowDark)"/>
  <text x="795" y="218" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="14">read</text>
  <path d="M600 322V374" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M452 482H364" stroke="#1B252D" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowDark)"/>
  <text x="376" y="460" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="14">creates</text>
  <path d="M752 482H836" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M986 464H1002" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M1006 312C1006 338 1006 360 1006 374" stroke="#1B252D" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowDark)"/>
</svg>
