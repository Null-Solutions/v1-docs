<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Exposure ratio example</title>
  <desc id="desc">An example market with 1000 units in the Receiver pool and 200 units in the Payer pool has exposure ratio E equals 5. A 2 percent reference price move transfers 20 units, which is 2 percent of Receiver value but 10 percent of Payer value before funding and caps.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0B0E15" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#45A5FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="34" fill="#F6F7F9"/>
  <circle cx="1040" cy="110" r="128" fill="#B1DFFF" fill-opacity="0.18"/>
  <circle cx="162" cy="510" r="138" fill="#B1DFFF" fill-opacity="0.14"/>
  <text x="64" y="78" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="34" letter-spacing="-0.02em">Exposure ratio concentrates Payer risk</text>
  <text x="64" y="114" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="18">The same value transfer is a smaller percentage of Receiver capital and a larger percentage of Payer capital.</text>

  <g filter="url(#softShadow)">
    <rect x="64" y="176" width="496" height="242" rx="32" fill="white"/>
    <text x="96" y="226" fill="#45A5FF" font-family="Inter, Arial, sans-serif" font-size="16">POOL SIZES</text>
    <text x="96" y="262" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="26" letter-spacing="-0.01em">Receiver = 1,000</text>
    <rect x="96" y="292" width="400" height="32" rx="16" fill="#45A5FF"/>
    <text x="96" y="366" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="26" letter-spacing="-0.01em">Payer = 200</text>
    <rect x="96" y="396" width="80" height="32" rx="16" fill="#1B252D"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="640" y="176" width="496" height="242" rx="32" fill="#0B0E15"/>
    <text x="674" y="226" fill="#B1DFFF" font-family="Inter, Arial, sans-serif" font-size="16">LIVE RATIO</text>
    <text x="674" y="278" fill="white" font-family="Inter, Arial, sans-serif" font-size="42" letter-spacing="-0.03em">E = 1,000 / 200 = 5</text>
    <text x="674" y="324" fill="#C9D0D9" font-family="Inter, Arial, sans-serif" font-size="18">Each 1 unit of Payer capital backs 5 units of Receiver exposure.</text>
    <rect x="674" y="354" width="342" height="38" rx="19" fill="#B1DFFF" fill-opacity="0.16"/>
    <text x="696" y="379" fill="#B1DFFF" font-family="Inter, Arial, sans-serif" font-size="15">Higher E means higher Payer leverage and higher funding pressure</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="146" y="454" width="908" height="62" rx="31" fill="white"/>
    <text x="188" y="492" fill="#0B0E15" font-family="Inter, Arial, sans-serif" font-size="20">Example: a 2% price move transfers 20 units</text>
    <path d="M598 485H700" stroke="#45A5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
    <text x="728" y="492" fill="#6D727A" font-family="Inter, Arial, sans-serif" font-size="18">Receiver: 2% impact. Payer: 10% impact.</text>
  </g>
</svg>
